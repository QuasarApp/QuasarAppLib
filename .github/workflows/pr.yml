name: CMake PR Test (Windows / Ubuntu / macOS)

on:
  pull_request:
    types: [opened, synchronize, reopened] # Triggers only on pull request events

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]

    steps:
    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        tools: 'tools_mingw1310'
        aqtversion: ==3.2.*

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (macOS)
      # The macOS Qt build is a universal binary (X86_64 + ARM64), so the
      # clang_64 package works on both the Intel and the Apple Silicon
      # runners.
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: ==3.2.*

    # Checkout the repository with the CMake submodule (the QuasarApp CMake
    # layer), which is required for the build.
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CQtDeployer
      uses: QuasarApp/cqtdeployer-install-action@main


    # A single configure step for all platforms: install-qt-action exports
    # the QT_ROOT_DIR environment variable on Windows, Linux and macOS.
    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --parallel 16

    - name: Run unit tests
      # The QuasarApp CMake layer registers the `test` aggregate target, which
      # deploys the QuasarAppTest executable with CQtDeployer and runs the Qt
      # Test suite (QuasarAppTests/).
      run: cmake --build ${{ github.workspace }}/build --parallel 1 --target test

    - name: Dump the test output (Windows diagnostics)
      # On Windows the console output of the deployed test executable is not
      # reliably captured by the CI log, so on failure the executable is run
      # a second time with the output redirected to a file that is printed
      # here.
      if: failure() && runner.os == 'Windows'
      shell: cmd
      run: |
        echo "=== Re-running the deployed test executable with captured output ==="
        "%GITHUB_WORKSPACE%\Testing\QuasarAppTest\QuasarAppTest.exe" > "%GITHUB_WORKSPACE%\Testing\QuasarAppTest\test_output.log" 2>&1
        echo "Exit code: %ERRORLEVEL%"
        type "%GITHUB_WORKSPACE%\Testing\QuasarAppTest\test_output.log"

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports-${{ matrix.os }}
        path: ${{ github.workspace }}/Testing/*/test_report.txt*
        if-no-files-found: ignore
