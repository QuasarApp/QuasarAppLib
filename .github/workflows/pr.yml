name: CMake PR Test (Windows / Ubuntu / macOS)

on:
  pull_request:
    types: [opened, synchronize, reopened] # Triggers only on pull request events

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]

    steps:
    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true
        tools: 'tools_mingw1310'
        aqtversion: ==3.2.*

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: ==3.2.*

    - name: Install Qt (macOS)
      # The macOS Qt build is a universal binary (X86_64 + ARM64), so the
      # clang_64 package works on both the Intel and the Apple Silicon
      # runners.
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: ==3.2.*

    # Checkout the repository with the CMake submodule (the QuasarApp CMake
    # layer), which is required for the build.
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # The `test` target of the QuasarApp CMake layer deploys the test
    # executable with the CQtDeployer tool, so the tool must be installed
    # before the tests are run.
    - name: Install CQtDeployer
      uses: QuasarApp/cqtdeployer-install-action@v1.0.1

    # The released Windows CQtDeployer binary (CQtDeployer.exe + Qt6Core.dll) is built with
    # the MSVCRT-based MinGW (aqt win64_mingw / tools_mingw1310, GCC 13.1.0), but the
    # bundled libstdc++-6.dll / libgcc_s_seh-1.dll / libwinpthread-1.dll in the release
    # zip are from a UCRT-based MinGW (GCC 13.2.0, "x86_64-ucrt-posix-seh"). Loading the
    # UCRT C++ runtime from the MSVCRT exe fails with STATUS_ENTRYPOINT_NOT_FOUND
    # (0xC0000139) before the deploy step can run. Overwrite the three runtime DLLs with
    # the matching MSVCRT versions shipped by aqt tools_mingw1310 so the bundle is
    # self-consistent. aqt installs that toolchain under %IQTA_TOOLS%\\mingw1310_64.
    - name: Fix CQtDeployer MinGW runtime (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        echo "Aligning CQtDeployer bundled MinGW runtime with aqt tools_mingw1310 (MSVCRT)"
        set "MINGW_BIN=%IQTA_TOOLS%\mingw1310_64\bin"
        if not exist "%MINGW_BIN%\libstdc++-6.dll" (
          echo "ERROR: aqt MSVCRT MinGW runtime not found at %MINGW_BIN%"
          echo "--- contents of %IQTA_TOOLS% ---"
          dir "%IQTA_TOOLS%" 2>nul
          exit /b 1
        )
        copy /Y "%MINGW_BIN%\libstdc++-6.dll" "%GITHUB_WORKSPACE%\cqt\libstdc++-6.dll"
        copy /Y "%MINGW_BIN%\libgcc_s_seh-1.dll" "%GITHUB_WORKSPACE%\cqt\libgcc_s_seh-1.dll"
        copy /Y "%MINGW_BIN%\libwinpthread-1.dll" "%GITHUB_WORKSPACE%\cqt\libwinpthread-1.dll"
        echo "Done."

    # A single configure step for all platforms: install-qt-action exports
    # the QT_ROOT_DIR environment variable on Windows, Linux and macOS.
    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --parallel 16

    - name: Run unit tests
      # The QuasarApp CMake layer registers the `test` aggregate target, which
      # deploys the QuasarAppTest executable with CQtDeployer and runs the Qt
      # Test suite (QuasarAppTests/).
      run: cmake --build ${{ github.workspace }}/build --parallel 16 --target test

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports-${{ matrix.os }}
        path: ${{ github.workspace }}/Testing/*/test_report.txt*
        if-no-files-found: ignore
